<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 查询链路对比</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9eff5; color: #172033; }
    main { width: min(97vw, 2100px); margin: 28px auto; }
    img { display: block; width: 100%; height: auto; border-radius: 24px; box-shadow: 0 18px 48px rgb(31 49 74 / 16%); }
    .note { margin: 18px 8px 0; color: #526176; font-size: 15px; line-height: 1.7; }
    code { padding: 2px 6px; border-radius: 5px; background: #f1edff; color: #5b21b6; }
  </style>
</head>
<body>
  <main>
    <img src="assert/rag-query-flow-comparison.svg" alt="Naive RAG 与图增强混合 RAG 查询流程对比">
    <p class="note">
      说明：当前系统使用 LightRAG <code>mix</code>。图中的 <code>LLM</code> 标签表示该节点
      由大语言模型完成；节点名称用于说明它负责查询理解还是回答生成。
    </p>
  </main>
</body>
</html>
