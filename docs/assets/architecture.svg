<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">RKLightRAG 总体架构</title>
  <desc id="desc">用户通过官方 LightRAG 调用 RK3588 上的模型网关，网关再访问 RK1828 本地模型服务并返回答案。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .box{stroke-width:2}.label{font:600 18px Arial,'Noto Sans SC',sans-serif;fill:#0f172a;text-anchor:middle}.sub{font:14px Arial,'Noto Sans SC',sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge-label{font:14px Arial,'Noto Sans SC',sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="330" rx="16" fill="#f8fafc"/>
  <text x="600" y="42" class="label" font-size="22">RKLightRAG 本地推理链路</text>
  <g>
    <rect x="48" y="126" width="180" height="86" rx="12" class="box" fill="#f1f5f9" stroke="#64748b"/>
    <text x="138" y="162" class="label">用户</text><text x="138" y="188" class="sub">WebUI / API</text>
    <rect x="300" y="110" width="210" height="118" rx="12" class="box" fill="#dbeafe" stroke="#2563eb"/>
    <text x="405" y="156" class="label">官方 LightRAG</text><text x="405" y="183" class="sub">RK3588 · WebUI 与知识库</text>
    <rect x="590" y="110" width="210" height="118" rx="12" class="box" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="695" y="156" class="label">Model Gateway</text><text x="695" y="183" class="sub">RK3588 · 统一 HTTP 接口</text>
    <rect x="880" y="110" width="210" height="118" rx="12" class="box" fill="#ffedd5" stroke="#ea580c"/>
    <text x="985" y="156" class="label">本地模型服务</text><text x="985" y="183" class="sub">RK1828 · LLM / 向量 / 重排</text>
  </g>
  <path d="M228 169H300" class="edge"/>
  <path d="M510 145H590" class="edge"/><text x="550" y="133" class="edge-label">本地 HTTP</text>
  <path d="M800 145H880" class="edge"/>
  <path d="M880 196H800" class="edge"/>
  <path d="M590 196H510" class="edge"/><text x="550" y="218" class="edge-label">模型结果</text>
  <path d="M300 196H228" class="edge"/><text x="264" y="218" class="edge-label">答案与引用</text>
</svg>
