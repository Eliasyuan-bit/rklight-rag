<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">RKLightRAG 文档入库流程</title>
  <desc id="desc">上传 Hook 对 Markdown 执行选择性路由，对 PDF 选择云端 MinerU 或 RKVision 本地解析，最终均进入官方 LightRAG 入库。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .box{stroke-width:2}.label{font:600 17px Arial,'Noto Sans SC',sans-serif;fill:#0f172a;text-anchor:middle}.sub{font:13px Arial,'Noto Sans SC',sans-serif;fill:#475569;text-anchor:middle}.edge{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.edge-label{font:13px Arial,'Noto Sans SC',sans-serif;fill:#475569;text-anchor:middle}.group{font:600 15px Arial,'Noto Sans SC',sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="560" rx="16" fill="#f8fafc"/>
  <text x="600" y="40" class="label" font-size="22">文档进入官方 LightRAG 的两条路径</text>
  <text x="46" y="86" class="group">上传与分流</text>
  <rect x="48" y="108" width="170" height="76" rx="12" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="133" y="140" class="label">用户上传文件</text><text x="133" y="163" class="sub">Markdown / PDF</text>
  <rect x="298" y="108" width="170" height="76" rx="12" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="383" y="140" class="label">上传 Hook</text><text x="383" y="163" class="sub">决定文件进入方式</text>
  <path d="M218 146H298" class="edge"/>
  <text x="540" y="86" class="group">Markdown</text>
  <rect x="530" y="108" width="170" height="76" rx="12" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="615" y="140" class="label">文档路由</text><text x="615" y="163" class="sub">选择性拆分</text>
  <rect x="785" y="70" width="175" height="76" rx="12" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="872" y="101" class="label">KG 文档 P</text><text x="872" y="124" class="sub">建图 + 文本检索</text>
  <rect x="785" y="166" width="175" height="76" rx="12" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="872" y="197" class="label">文本文档 P!</text><text x="872" y="220" class="sub">仅文本检索</text>
  <path d="M468 130H530" class="edge"/><text x="499" y="120" class="edge-label">普通 Markdown</text>
  <path d="M700 132H785" class="edge"/><path d="M700 163L785 204" class="edge"/>
  <text x="540" y="312" class="group">PDF</text>
  <rect x="530" y="334" width="195" height="78" rx="12" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="627" y="365" class="label">官方 MinerU 云端解析</text><text x="627" y="389" class="sub">cloud profile</text>
  <rect x="775" y="334" width="195" height="78" rx="12" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="872" y="365" class="label">RKVision 本地解析</text><text x="872" y="389" class="sub">rkvision profile · RK3588</text>
  <path d="M468 165L530 353" class="edge"/><text x="490" y="270" class="edge-label">PDF · cloud</text>
  <path d="M468 165L775 353" class="edge"/><text x="656" y="285" class="edge-label">PDF · rkvision</text>
  <rect x="1015" y="218" width="150" height="116" rx="12" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1090" y="258" class="label">官方 LightRAG</text><text x="1090" y="283" class="sub">文本块、向量、</text><text x="1090" y="304" class="sub">实体、关系与图谱</text>
  <path d="M960 108L1015 238" class="edge"/><path d="M960 204L1015 269" class="edge"/>
  <path d="M725 373H1015" class="edge"/><path d="M970 373L1015 313" class="edge"/>
  <text x="600" y="500" class="sub">Hook 只负责上传后的路由；所有分支最终仍由官方 LightRAG 写入并管理知识库。</text>
</svg>
