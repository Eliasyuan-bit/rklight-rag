<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1040" viewBox="0 0 2100 1040" role="img" aria-labelledby="title desc">
  <title id="title"> </title>
  <desc id="desc"> </desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf3f8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f9f88"/>
      <stop offset="1" stop-color="#08766a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#24344d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/>
    </marker>
    <style>
      .zh { font-family: "Droid Sans Fallback", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
      .latin { font-family: "DejaVu Sans", Arial, sans-serif !important; }
      .title { font-family: "Droid Sans Fallback"; font-size: 34px; font-weight: 700; fill: #172033; }
      .subtitle { font-family: "Droid Sans Fallback"; font-size: 17px; fill: #617087; }
      .section { font-family: "Droid Sans Fallback"; font-size: 25px; font-weight: 700; fill: #172033; }
      .section-note { font-family: "Droid Sans Fallback"; font-size: 15px; fill: #728096; }
      .box-title { font-family: "Droid Sans Fallback"; font-size: 18px; font-weight: 700; fill: #1e293b; }
      .box-sub { font-family: "Droid Sans Fallback"; font-size: 14px; fill: #64748b; }
      .white-title { font-family: "Droid Sans Fallback"; font-size: 18px; font-weight: 700; fill: white; }
      .white-sub { font-family: "Droid Sans Fallback"; font-size: 14px; fill: #e7efff; }
      .badge { font-family: "Droid Sans Fallback"; font-size: 13px; font-weight: 700; }
      .arrow { stroke: #718096; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b5cf6; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="2100" height="1040" fill="url(#bg)"/>
  <rect x="38" y="34" width="2024" height="972" rx="30" fill="#ffffff" stroke="#dce4ee"/>

  <g class="zh" font-family="Droid Sans Fallback">
    <text x="78" y="91" class="title"><tspan class="latin">RAG </tspan><tspan>查询链路对比</tspan></text>
    <text x="78" y="124" class="subtitle">从单路向量召回，到结合查询理解与图谱的混合检索</text>

    <!-- Naive RAG -->
    <rect x="72" y="162" width="1956" height="296" rx="24" fill="#f8fbff" stroke="#cfe0f5"/>
    <circle cx="102" cy="201" r="7" fill="#2563eb"/>
    <rect x="121" y="187" width="37" height="25" rx="12" fill="#dbeafe"/>
    <text x="139" y="205" text-anchor="middle" class="badge latin" fill="#1d4ed8">01</text>
    <text x="171" y="210" class="section"><tspan></tspan><tspan class="latin">Naive RAG</tspan></text>
    <text x="171" y="237" class="section-note">单路向量召回</text>

    <g filter="url(#shadow)">
      <rect x="92" y="285" width="200" height="98" rx="18" fill="#ffffff" stroke="#cbd8e7"/>
      <rect x="350" y="285" width="230" height="98" rx="18" fill="#ffffff" stroke="#cbd8e7"/>
      <rect x="638" y="285" width="220" height="98" rx="18" fill="#ffffff" stroke="#cbd8e7"/>
      <rect x="916" y="285" width="210" height="98" rx="18" fill="#ffffff" stroke="#cbd8e7"/>
      <rect x="1184" y="285" width="200" height="98" rx="18" fill="#fffaf0" stroke="#efcf8d"/>
      <rect x="1442" y="285" width="210" height="98" rx="18" fill="url(#blue)"/>
      <rect x="1710" y="285" width="180" height="98" rx="18" fill="#eaf7f3" stroke="#9fd6c8"/>
    </g>
    <text x="192" y="326" text-anchor="middle" class="box-title">用户问题</text>
    <text x="192" y="353" text-anchor="middle" class="box-sub">原始问题</text>
    <text x="465" y="326" text-anchor="middle" class="box-title latin">Query Embedding</text>
    <text x="465" y="353" text-anchor="middle" class="box-sub">问题向量化</text>
    <text x="748" y="326" text-anchor="middle" class="box-title">向量检索</text>
    <text x="748" y="353" text-anchor="middle" class="box-sub">相似度召回</text>
    <text x="1021" y="326" text-anchor="middle" class="box-title"><tspan class="latin">Top-K </tspan><tspan>文本块</tspan></text>
    <text x="1021" y="353" text-anchor="middle" class="box-sub">候选上下文</text>
    <text x="1284" y="326" text-anchor="middle" class="box-title latin">Rerank</text>
    <text x="1284" y="353" text-anchor="middle" class="box-sub">可选重排</text>
    <rect x="1460" y="298" width="54" height="23" rx="11" fill="#dbeafe"/>
    <text x="1487" y="315" text-anchor="middle" class="badge latin" fill="#1d4ed8">LLM</text>
    <text x="1547" y="345" text-anchor="middle" class="white-title">回答生成</text>
    <text x="1547" y="370" text-anchor="middle" class="white-sub">基于检索上下文</text>
    <text x="1800" y="326" text-anchor="middle" class="box-title">答案</text>
    <text x="1800" y="353" text-anchor="middle" class="box-sub">引用</text>
    <path d="M292 334 H341" class="arrow"/><path d="M580 334 H629" class="arrow"/>
    <path d="M858 334 H907" class="arrow"/><path d="M1126 334 H1175" class="arrow"/>
    <path d="M1384 334 H1433" class="arrow"/><path d="M1652 334 H1701" class="arrow"/>

    <!-- Hybrid / Graph RAG -->
    <rect x="72" y="486" width="1956" height="452" rx="24" fill="#fbf9ff" stroke="#dfd2f6"/>
    <circle cx="102" cy="527" r="7" fill="#7c3aed"/>
    <rect x="121" y="513" width="37" height="25" rx="12" fill="#ede9fe"/>
    <text x="139" y="531" text-anchor="middle" class="badge latin" fill="#6d28d9">02</text>
    <text x="171" y="536" class="section"><tspan>混合增强 / </tspan><tspan class="latin">Graph RAG</tspan></text>
    <text x="171" y="563" class="section-note"><tspan></tspan><tspan class="latin"></tspan><tspan> 查询理解 + 文本与图谱多路召回 </tspan></text>

    <g filter="url(#shadow)">
      <rect x="92" y="650" width="180" height="120" rx="20" fill="#ffffff" stroke="#d5c9ea"/>
      <rect x="330" y="625" width="280" height="170" rx="22" fill="url(#purple)"/>
      <rect x="680" y="650" width="230" height="120" rx="20" fill="#ffffff" stroke="#cbd8e7"/>
      <rect x="980" y="610" width="340" height="200" rx="22" fill="#ffffff" stroke="#cbb8eb"/>
      <rect x="1380" y="650" width="200" height="120" rx="20" fill="#fffaf0" stroke="#efcf8d"/>
      <rect x="1640" y="650" width="190" height="120" rx="20" fill="url(#blue)"/>
      <rect x="1900" y="650" width="110" height="120" rx="20" fill="#eaf7f3" stroke="#9fd6c8"/>
    </g>

    <text x="182" y="701" text-anchor="middle" class="box-title">用户问题</text>
    <text x="182" y="730" text-anchor="middle" class="box-sub">原始问题</text>

    <rect x="350" y="643" width="60" height="25" rx="12" fill="#ede9fe"/>
    <text x="380" y="661" text-anchor="middle" class="badge latin" fill="#5b21b6">LLM</text>
    <text x="470" y="707" text-anchor="middle" class="white-title">查询理解</text>
    <text x="470" y="739" text-anchor="middle" class="white-sub">高层主题词</text>
    <text x="470" y="767" text-anchor="middle" class="white-sub">低层实体词</text>

    <text x="795" y="701" text-anchor="middle" class="box-title latin">Query Embedding</text>
    <text x="795" y="730" text-anchor="middle" class="box-sub">原问题 + 关键词</text>

    <text x="1150" y="640" text-anchor="middle" class="box-title">混合检索</text>
    <rect x="1008" y="656" width="284" height="36" rx="11" fill="#eaf2ff"/>
    <text x="1150" y="680" text-anchor="middle" class="box-sub"><tspan class="latin">Dense</tspan><tspan> 向量召回</tspan></text>
    <rect x="1008" y="700" width="284" height="36" rx="11" fill="#edf6ff"/>
    <text x="1150" y="724" text-anchor="middle" class="box-sub"><tspan class="latin">BM25</tspan><tspan> 词法召回</tspan></text>
    <rect x="1008" y="744" width="284" height="36" rx="11" fill="#f0ebff"/>
    <text x="1150" y="768" text-anchor="middle" class="box-sub">实体 + 关系图谱召回</text>
    <text x="1150" y="802" text-anchor="middle" class="section-note">多路候选合并</text>

    <text x="1480" y="701" text-anchor="middle" class="box-title latin">Rerank</text>
    <text x="1480" y="730" text-anchor="middle" class="box-sub">可选重排</text>

    <rect x="1658" y="665" width="54" height="23" rx="11" fill="#dbeafe"/>
    <text x="1685" y="682" text-anchor="middle" class="badge latin" fill="#1d4ed8">LLM</text>
    <text x="1735" y="721" text-anchor="middle" class="white-title">回答生成</text>
    <text x="1735" y="750" text-anchor="middle" class="white-sub">基于检索上下文</text>
    <text x="1955" y="701" text-anchor="middle" class="box-title">答案</text>
    <text x="1955" y="730" text-anchor="middle" class="box-sub">引用</text>

    <path d="M272 710 H321" class="arrow"/><path d="M610 710 H671" class="arrow"/>
    <path d="M910 710 H971" class="arrow"/><path d="M1320 710 H1371" class="arrow"/>
    <path d="M1580 710 H1631" class="arrow"/><path d="M1830 710 H1891" class="arrow"/>

    <rect x="380" y="858" width="850" height="34" rx="17" fill="#eef2ff"/>
    <text x="805" y="881" text-anchor="middle" class="badge" fill="#4338ca">图检索需要结构化查询入口；简单问题可由规则或缓存跳过查询理解 LLM</text>
  </g>
</svg>
