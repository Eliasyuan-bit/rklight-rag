[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rklight-rag-rkvision-parser"
version = "0.1.0"
description = "RK3588 Document Vision parser plugin for LightRAG"
requires-python = ">=3.10"

[project.entry-points."lightrag.parsers"]
rkvision = "rkvision_lightrag.plugin:register"

[tool.setuptools.packages.find]
include = ["rkvision_lightrag*"]
